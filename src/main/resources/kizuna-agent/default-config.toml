# Kizuna Agent：游戏内 AI 助手的全部设置都在这一个文件里。改完重新进一次世界生效。
# 游戏里用法：/agent <要它做什么>；/agent status 看这里哪一项还没配好。

[model]
# 模型接口的协议：openai-completions（最通用）、openai-responses、anthropic-messages、google-generative-ai
api = "openai-completions"
# 接口地址，例如 http://127.0.0.1:8317/v1
base_url = ""
# 密钥。只写在这里；不会写进日志，也不会写进别的文件
api_key = ""
# 进世界时用的模型：下面模型清单里的别名，或者直接写模型名，例如 gemini-3.8-flash-high
model = ""
# 备用模型，写法同上。主模型报 429 或额度用尽时自动换它重试，并在聊天栏说一声；留空就不换
fallback_model = ""
# 思考档位：off、minimal、low、medium、high。清单里没单独写 thinking 的模型、不在清单里的模型用这一档
thinking = "off"
# 模型的上下文长度（token）。对话接近这个长度时自动压缩前文
context_window = 200000
# 模型能不能看图。能看图时，助手截的游戏画面直接发给它看；不能看图就写 false，截图只存成文件
vision = true

# 模型清单：每个模型一段 [[models]]，想加几个加几个；不写清单也能用。
# 游戏里 /agent model <别名> 换模型，/agent thinking <档> 调现在这个模型的思考档位（会写回这个文件），都能按 Tab 补全。
#   alias            游戏里叫它的名字；不写就用 id
#   id               发给接口的模型名
#   thinking         这个模型的思考档位；不写就用上面 [model] 的
#   thinking_levels  这个模型认哪几档，每一档发给接口什么值（reasoning_effort）。
#                    不写：off、minimal、low、medium、high 五档，off 不发参数，其余照原名发。
#                    off = "" 表示关思考时不发参数。
#                    写成 {} 表示这个模型的思考档位由模型名决定，什么参数都不发，/agent thinking 对它不起作用。
#   api、base_url、api_key、context_window、vision  这个模型自己的接口和能不能看图；不写就用上面 [model] 的
#
# [[models]]
# alias = "gemini"
# id = "gemini-3.8-flash-high"
# thinking = "low"
#
# [[models]]
# alias = "sol"
# id = "gpt-6.1-sol"
# thinking = "medium"
# thinking_levels = { off = "none", low = "low", medium = "medium", high = "high", xhigh = "xhigh" }

[runtime]
# Node.js 的位置（要 22.19 以上）。留空自动找：PATH、常见安装位置
node = ""
# Python 的位置，只在跑建筑脚本时用。留空自动找：Windows 上先试 py -3，再找 PATH 上的 python
python = ""

[tools]
# 让助手动这台电脑：读写文件、跑 Python 脚本、跑 PowerShell（Linux 上是 bash）。
# 关掉后助手只剩游戏内的工具：执行指令、读写方块、看模组 JAR、截游戏画面，以及它自己的记忆和技能
# （记忆和技能只写在本模组的数据目录 config/kizuna-agent/pi-home/ 里，不算动电脑）
local_code = true

[bridge]
# 游戏内接口监听的本机端口；0 表示每次随机挑一个
port = 0
# 批量放方块时每个 tick 最多占多少毫秒。调大放得快，调太大游戏会卡
blocks_per_tick_millis = 10
